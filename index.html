<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="infos">
          <div class="info">
            <h3>High Score: <span id="finalScore">0</span></h3>
          </div>
          <div class="info">
            <h3>Score: <span id="score">0</span></h3>
          </div>
          <div class="info">
            <h3>Time: <span id="time">0-0</span></h3>
          </div>
        </div>

        <div class="board"></div>

        <div class="popup-cont">
          <div class="start-game-popup">
            <h2>Snake Game</h2>
            <p>Press Enter And Space key to start playing!</p>
            <button id="startBtn">Start Game</button>
          </div>

          <div class="game-end-popup">
            <h2>Game Over</h2>
            <button id="restartBtn">Restart Game</button>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
